name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux ${{ matrix.arch }} (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # A guest is machine code for the CPU it runs on, so every build is
        # made and tested on each CPU miniBox runs: x86-64, and aarch64 on a
        # 4 KiB-page arm runner (the same Ubuntu, so the same gcc). Of a
        # 16 KiB host only the refusal of a guest fault handler is run here
        # (threads-grouped-refused, through MB_HOST_PAGE, which any host can
        # simulate); the rest of the suite was run on a real one by hand.
        arch: [x86_64, aarch64]
        name: [c-guests, cpp-guests]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-26.04-arm
          # The default build: host + C guest toolchain (musl) + C guests.
          - name: c-guests
            setup_args: ''
          # Adds the C++ guest toolchain (libstdc++ retargeted to the guest).
          # Fetches the GCC source matching the runner's compiler, so it is
          # kept as a separate job rather than slowing the default one.
          - name: cpp-guests
            setup_args: '-Dguest_cpp=true'
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential

      - name: Record toolchain versions
        id: tc
        run: |
          echo "gcc=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
          gcc --version | head -1
          meson --version

      # The only slow part of the C++ job is fetching the ~84MB GCC tarball;
      # libstdc++ itself is ~60 CPU-seconds. Cache the tarball at the exact path
      # the build looks for it, keyed on the compiler it must match.
      - name: Cache GCC source tarball
        if: matrix.name == 'cpp-guests'
        uses: actions/cache@v4
        with:
          path: build/ci/cpp-toolchain/gcc-${{ steps.tc.outputs.gcc }}.tar.xz
          key: gcc-src-${{ steps.tc.outputs.gcc }}

      - name: Configure
        run: meson setup build/ci ${{ matrix.setup_args }}

      - name: Build
        run: meson compile -C build/ci

      - name: Test
        run: meson test -C build/ci --print-errorlogs

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ matrix.arch }}-${{ matrix.name }}
          path: build/ci/meson-logs/

      # A guest .wbx is a static ELF the host maps itself, so it is
      # OS-INDEPENDENT: the same binary a Linux job builds is what the Windows
      # jobs run. That is what makes guest coverage on Windows possible at all,
      # since the guest toolchain is Linux-only. It is NOT CPU-independent:
      # each Windows job takes the guest of its CPU (x86-64 or arm64).
      - name: Upload the guest for the Windows jobs
        if: matrix.name == 'c-guests'
        uses: actions/upload-artifact@v4
        with:
          name: guest-wbx-${{ matrix.arch }}
          path: build/ci/tests/conformance/guest.wbx

      # The threads guest, whose fault handler runs inside the host's own on
      # Windows (run_threads: a stop that lands in there, chimera#363)
      - name: Upload the threads guest for the Windows jobs
        if: matrix.name == 'c-guests'
        uses: actions/upload-artifact@v4
        with:
          name: guest-threads-wbx-${{ matrix.arch }}
          path: build/ci/tests/threads/guest_threads.wbx

  macos:
    # Apple silicon: 16 KiB pages, no TPIDR_EL0 or x18 for the guest, and no
    # page both writable and executable - everything the macOS PAL is for.
    # An Intel Mac: the guest's gs swapped at each boundary, and no
    # rdfsbase/wrfsbase. Guests are built with Homebrew's bare-metal gcc for
    # the CPU (aarch64-elf-gcc, x86_64-elf-gcc), as meson.build picks it.
    name: macos ${{ matrix.arch }} (c-guests)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install meson ninja ${{ matrix.arch }}-elf-gcc

      - name: Configure
        run: meson setup build/ci

      - name: Build
        run: meson compile -C build/ci

      - name: Test
        run: meson test -C build/ci --print-errorlogs

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-macos-${{ matrix.arch }}
          path: build/ci/meson-logs/

      - name: Why macOS killed a test (on failure)
        if: failure()
        run: |
          # a test macOS ends with SIGKILL says nothing itself: run test_delta
          # again, watching its memory, and ask the system log who killed it
          t=build/ci/tests/unit/test_delta
          "$t" > td.out 2>&1 & pid=$!
          for i in $(seq 1 90); do
            kill -0 $pid 2>/dev/null || break
            echo "$i s: $(ps -o rss=,vsz= -p $pid) (rss, vsz in KiB)"
            sleep 1
          done
          kill -9 $pid 2>/dev/null || true
          wait $pid; echo "exit $?"
          tail -5 td.out
          log show --last 3m --style compact --predicate 'eventMessage CONTAINS[c] "test_delta" OR eventMessage CONTAINS[c] "jetsam" OR eventMessage CONTAINS[c] "memorystatus" OR eventMessage CONTAINS[c] "code signature"' | tail -40

  windows-cross:
    name: windows build (mingw-w64 cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential gcc-mingw-w64-x86-64
          # NOT --no-install-recommends: the `wine` launcher is a Recommends of
          # wine64, and without it there is no `wine` binary on PATH.
          sudo apt-get install -y wine64

      # Cross builds skip the guest toolchain and guest tests by design: a guest
      # is a fake-machine target built with the host compiler. The host itself,
      # its unit tests, and the Windows PAL / fault handler / ABI adapter all
      # build here and are executed by the windows-test job below.
      - name: Configure (mingw-w64 cross)
        run: meson setup build/ci-win --cross-file source/host/mingw-w64.ini

      - name: Build
        run: meson compile -C build/ci-win

      # Fast smoke test of the Windows PAL without waiting for a Windows runner.
      # wine is NOT Windows - it reimplements the Win32 API - so a pass here is
      # good evidence but not authoritative; the windows-test job below is. A
      # failure here is still worth investigating: these tests drive the VEH
      # fault handler, guard-page stack tracking and the CreateFileMapping mirror
      # mapping (146 + 28 checks in memblock/savestate alone).
      - name: Run unit tests under wine
        env:
          WINEDEBUG: '-all'
          WINEPREFIX: ${{ runner.temp }}/wineprefix
        run: |
          wineboot --init >/dev/null 2>&1 || true
          failed=0
          for exe in build/ci-win/tests/unit/*.exe; do
            echo "== $(basename "$exe")"
            wine "$exe" || failed=1
          done
          exit $failed

      # Best effort only: wine struggles with the fixed high-address mappings the
      # waterbox needs (the interop area at 0x35f00000000 and the guest block),
      # so a failure here is not authoritative - the native job below is. Kept
      # because when it does run, it catches ABI and fault-handler breakage
      # within seconds instead of waiting for a Windows runner.
      - name: Run a guest under wine (best effort)
        continue-on-error: true
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/wineprefix
        run: |
          wineboot --init >/dev/null 2>&1 || true
          wine build/ci-win/tests/runner/run_guest.exe build/ci/tests/conformance/guest.wbx

      - name: Stage Windows artifacts
        run: |
          mkdir -p artifacts
          cp build/ci-win/source/host/libminiboxhost.dll artifacts/
          cp build/ci-win/tests/unit/*.exe artifacts/
          # the guest runner: unit tests never execute a guest, and until this
          # was added no guest had ever run on Windows - the win64<->sysv64
          # boundary was only ever exercised on Linux
          cp build/ci-win/tests/runner/run_guest.exe artifacts/
          cp build/ci-win/tests/runner/run_threads.exe artifacts/
          # the unit tests link the host statically, but mingw still needs its
          # own runtime beside them
          cp /usr/lib/gcc/x86_64-w64-mingw32/*-posix/libgcc_s_seh-1.dll artifacts/ 2>/dev/null || true
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll artifacts/ 2>/dev/null || true
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: artifacts/

  windows-test:
    # Runs the cross-built unit tests on a real Windows machine. This is the only
    # runtime validation the Windows PAL gets - the VEH fault handler, guard-page
    # stack tracking and CreateFileMapping-based mirror mapping have no Linux
    # equivalent, so building alone proves very little about them.
    name: windows unit tests (native run)
    needs: windows-cross
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts

      - name: Fetch the Linux-built guest
        uses: actions/download-artifact@v4
        with:
          name: guest-wbx-x86_64
          path: artifacts

      - name: Fetch the Linux-built threads guest
        uses: actions/download-artifact@v4
        with:
          name: guest-threads-wbx-x86_64
          path: artifacts

      - name: Run unit tests
        shell: pwsh
        working-directory: artifacts
        run: |
          $failed = 0
          Get-ChildItem -Filter *.exe | Where-Object { $_.Name -ne "run_guest.exe" -and $_.Name -ne "run_threads.exe" } | ForEach-Object {
            Write-Host "== $($_.Name)"
            & ".\$($_.Name)"
            if ($LASTEXITCODE -ne 0) { Write-Host "   FAILED ($LASTEXITCODE)"; $failed = 1 }
          }
          exit $failed

      # The one that actually runs guest code on Windows: ELF load, entry through
      # the win64<->sysv64 trampolines, guest syscalls, a guest->host callback,
      # sealed/invisible memory and a savestate round-trip. Everything the unit
      # tests cannot reach, and where the ABI bug that shipped to a user lived.
      - name: Run a guest (the win64 <-> sysv64 path)
        shell: pwsh
        working-directory: artifacts
        run: |
          & ".\run_guest.exe" ".\guest.wbx"
          if ($LASTEXITCODE -ne 0) { throw "guest run failed ($LASTEXITCODE)" }

      # Green threads, and the guest's own fault handler, which on Windows runs
      # inside the host's: it may fault again, give way to another thread, die
      # in there, or loop in there until a stop from another thread ends it.
      - name: Run the threads guest
        shell: pwsh
        working-directory: artifacts
        run: |
          & ".\run_threads.exe" ".\guest_threads.wbx"
          if ($LASTEXITCODE -ne 0) { throw "threads guest run failed ($LASTEXITCODE)" }

  windows-arm64-cross:
    # Windows on arm64: the host cross-built with llvm-mingw (mingw-w64's GCC
    # has no arm64 Windows target), a pinned release checked by its SHA256.
    # As for x86-64, the guests are the Linux arm64 job's.
    name: windows arm64 build (llvm-mingw cross)
    runs-on: ubuntu-latest
    env:
      LLVM_MINGW: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_SHA256: 55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build

      - name: llvm-mingw
        run: |
          curl -sSL --fail --retry 3 -o "$RUNNER_TEMP/$LLVM_MINGW.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/$LLVM_MINGW.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$LLVM_MINGW.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"

      - name: Configure (llvm-mingw cross)
        run: meson setup build/ci-win-arm64 --cross-file source/host/mingw-w64-aarch64.ini

      - name: Build
        run: meson compile -C build/ci-win-arm64

      - name: Stage Windows arm64 artifacts
        run: |
          mkdir -p artifacts
          cp build/ci-win-arm64/source/host/libminiboxhost.dll artifacts/
          cp build/ci-win-arm64/tests/unit/*.exe artifacts/
          cp build/ci-win-arm64/tests/runner/run_guest.exe artifacts/
          cp build/ci-win-arm64/tests/runner/run_threads.exe artifacts/
          # llvm-mingw's own runtime, for whatever links it dynamically
          cp "$RUNNER_TEMP/$LLVM_MINGW"/aarch64-w64-mingw32/bin/*.dll artifacts/ 2>/dev/null || true
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-build
          path: artifacts/

  windows-arm64-test:
    # The cross-built host, its unit tests and the guests, on Windows on arm64
    name: windows arm64 unit tests (native run)
    needs: [windows-arm64-cross, linux]
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-arm64-build
          path: artifacts

      - name: Fetch the Linux-built guests (arm64)
        uses: actions/download-artifact@v4
        with:
          pattern: guest-*-aarch64
          path: artifacts
          merge-multiple: true

      - name: Run unit tests
        shell: pwsh
        working-directory: artifacts
        run: |
          $failed = 0
          Get-ChildItem -Filter *.exe | Where-Object { $_.Name -ne "run_guest.exe" -and $_.Name -ne "run_threads.exe" } | ForEach-Object {
            Write-Host "== $($_.Name)"
            & ".\$($_.Name)"
            if ($LASTEXITCODE -ne 0) { Write-Host "   FAILED ($LASTEXITCODE)"; $failed = 1 }
          }
          exit $failed

      - name: Run a guest
        shell: pwsh
        working-directory: artifacts
        run: |
          & ".\run_guest.exe" ".\guest.wbx"
          if ($LASTEXITCODE -ne 0) { throw "guest run failed ($LASTEXITCODE)" }

      - name: Run the threads guest
        shell: pwsh
        working-directory: artifacts
        run: |
          & ".\run_threads.exe" ".\guest_threads.wbx"
          if ($LASTEXITCODE -ne 0) { throw "threads guest run failed ($LASTEXITCODE)" }

      # Windows on arm64 is new: when a guest run fails, the same run again with
      # every system call it makes said, and miniBox's own log of the death
      - name: On failure, the guest again with its system calls said
        if: failure()
        shell: pwsh
        working-directory: artifacts
        run: |
          $env:MINIBOX_TRACE_SYSCALLS = "1"
          & ".\run_guest.exe" ".\guest.wbx" 2>&1 | Select-Object -Last 80
          Write-Host "exit: $LASTEXITCODE"
          if (Test-Path minibox-diag.log) { Get-Content minibox-diag.log -Tail 120 }
