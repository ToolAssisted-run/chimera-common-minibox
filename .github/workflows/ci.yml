name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux ${{ matrix.arch }} (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # A guest is machine code for the CPU it runs on, so every build is
        # made and tested on each CPU miniBox runs: x86-64, and aarch64 on a
        # 4 KiB-page arm runner (the same Ubuntu, so the same gcc). A 16 KiB
        # host is covered by MB_HOST_PAGE, which any host can simulate.
        arch: [x86_64, aarch64]
        name: [c-guests, cpp-guests]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
          # The default build: host + C guest toolchain (musl) + C guests.
          - name: c-guests
            setup_args: ''
          # Adds the C++ guest toolchain (libstdc++ retargeted to the guest).
          # Fetches the GCC source matching the runner's compiler, so it is
          # kept as a separate job rather than slowing the default one.
          - name: cpp-guests
            setup_args: '-Dguest_cpp=true'
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential

      - name: Record toolchain versions
        id: tc
        run: |
          echo "gcc=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
          gcc --version | head -1
          meson --version

      # The only slow part of the C++ job is fetching the ~84MB GCC tarball;
      # libstdc++ itself is ~60 CPU-seconds. Cache the tarball at the exact path
      # the build looks for it, keyed on the compiler it must match.
      - name: Cache GCC source tarball
        if: matrix.name == 'cpp-guests'
        uses: actions/cache@v4
        with:
          path: build/ci/cpp-toolchain/gcc-${{ steps.tc.outputs.gcc }}.tar.xz
          key: gcc-src-${{ steps.tc.outputs.gcc }}

      - name: Configure
        run: meson setup build/ci ${{ matrix.setup_args }}

      - name: Build
        run: meson compile -C build/ci

      - name: Test
        run: meson test -C build/ci --print-errorlogs

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ matrix.arch }}-${{ matrix.name }}
          path: build/ci/meson-logs/

      # A guest .wbx is a static ELF the host maps itself, so it is
      # OS-INDEPENDENT: the same binary a Linux job builds is what the Windows
      # jobs run. That is what makes guest coverage on Windows possible at all,
      # since the guest toolchain is Linux-only. It is NOT CPU-independent:
      # the Windows jobs are x86-64, so theirs is the x86-64 build's.
      - name: Upload the guest for the Windows jobs
        if: matrix.name == 'c-guests' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: guest-wbx
          path: build/ci/tests/conformance/guest.wbx

  windows-cross:
    name: windows build (mingw-w64 cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential gcc-mingw-w64-x86-64
          # NOT --no-install-recommends: the `wine` launcher is a Recommends of
          # wine64, and without it there is no `wine` binary on PATH.
          sudo apt-get install -y wine64

      # Cross builds skip the guest toolchain and guest tests by design: a guest
      # is a fake-machine target built with the host compiler. The host itself,
      # its unit tests, and the Windows PAL / fault handler / ABI adapter all
      # build here and are executed by the windows-test job below.
      - name: Configure (mingw-w64 cross)
        run: meson setup build/ci-win --cross-file source/host/mingw-w64.ini

      - name: Build
        run: meson compile -C build/ci-win

      # Fast smoke test of the Windows PAL without waiting for a Windows runner.
      # wine is NOT Windows - it reimplements the Win32 API - so a pass here is
      # good evidence but not authoritative; the windows-test job below is. A
      # failure here is still worth investigating: these tests drive the VEH
      # fault handler, guard-page stack tracking and the CreateFileMapping mirror
      # mapping (146 + 28 checks in memblock/savestate alone).
      - name: Run unit tests under wine
        env:
          WINEDEBUG: '-all'
          WINEPREFIX: ${{ runner.temp }}/wineprefix
        run: |
          wineboot --init >/dev/null 2>&1 || true
          failed=0
          for exe in build/ci-win/tests/unit/*.exe; do
            echo "== $(basename "$exe")"
            wine "$exe" || failed=1
          done
          exit $failed

      # Best effort only: wine struggles with the fixed high-address mappings the
      # waterbox needs (the interop area at 0x35f00000000 and the guest block),
      # so a failure here is not authoritative - the native job below is. Kept
      # because when it does run, it catches ABI and fault-handler breakage
      # within seconds instead of waiting for a Windows runner.
      - name: Run a guest under wine (best effort)
        continue-on-error: true
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/wineprefix
        run: |
          wineboot --init >/dev/null 2>&1 || true
          wine build/ci-win/tests/runner/run_guest.exe build/ci/tests/conformance/guest.wbx

      - name: Stage Windows artifacts
        run: |
          mkdir -p artifacts
          cp build/ci-win/source/host/libminiboxhost.dll artifacts/
          cp build/ci-win/tests/unit/*.exe artifacts/
          # the guest runner: unit tests never execute a guest, and until this
          # was added no guest had ever run on Windows - the win64<->sysv64
          # boundary was only ever exercised on Linux
          cp build/ci-win/tests/runner/run_guest.exe artifacts/
          # the unit tests link the host statically, but mingw still needs its
          # own runtime beside them
          cp /usr/lib/gcc/x86_64-w64-mingw32/*-posix/libgcc_s_seh-1.dll artifacts/ 2>/dev/null || true
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll artifacts/ 2>/dev/null || true
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: artifacts/

  windows-test:
    # Runs the cross-built unit tests on a real Windows machine. This is the only
    # runtime validation the Windows PAL gets - the VEH fault handler, guard-page
    # stack tracking and CreateFileMapping-based mirror mapping have no Linux
    # equivalent, so building alone proves very little about them.
    name: windows unit tests (native run)
    needs: windows-cross
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts

      - name: Fetch the Linux-built guest
        uses: actions/download-artifact@v4
        with:
          name: guest-wbx
          path: artifacts

      - name: Run unit tests
        shell: pwsh
        working-directory: artifacts
        run: |
          $failed = 0
          Get-ChildItem -Filter *.exe | Where-Object { $_.Name -ne "run_guest.exe" } | ForEach-Object {
            Write-Host "== $($_.Name)"
            & ".\$($_.Name)"
            if ($LASTEXITCODE -ne 0) { Write-Host "   FAILED ($LASTEXITCODE)"; $failed = 1 }
          }
          exit $failed

      # The one that actually runs guest code on Windows: ELF load, entry through
      # the win64<->sysv64 trampolines, guest syscalls, a guest->host callback,
      # sealed/invisible memory and a savestate round-trip. Everything the unit
      # tests cannot reach, and where the ABI bug that shipped to a user lived.
      - name: Run a guest (the win64 <-> sysv64 path)
        shell: pwsh
        working-directory: artifacts
        run: |
          & ".\run_guest.exe" ".\guest.wbx"
          if ($LASTEXITCODE -ne 0) { throw "guest run failed ($LASTEXITCODE)" }
