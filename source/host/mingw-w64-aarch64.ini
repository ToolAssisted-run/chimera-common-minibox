# Cross-file to cross-compile the miniBox host as a Windows on arm64 DLL with
# llvm-mingw (clang; mingw-w64's GCC has no arm64 Windows target). Its bin/
# folder must be on PATH. CI fetches a pinned release (.github/workflows/ci.yml).
#
#   meson setup build/meson-windows-aarch64 --cross-file source/host/mingw-w64-aarch64.ini

[binaries]
c = 'aarch64-w64-mingw32-clang'
cpp = 'aarch64-w64-mingw32-clang++'
ar = 'aarch64-w64-mingw32-ar'
strip = 'aarch64-w64-mingw32-strip'
windres = 'aarch64-w64-mingw32-windres'

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
